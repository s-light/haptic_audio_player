# haptic audio player: nginx on port 80 in front of the player (127.0.0.1:8080), so the web UI is just http://<board-ip>.
# Installed by `./setup_pb2.py nginx` as /etc/nginx/sites-available/haptic-player (+ symlink in sites-enabled; the stock
# "default" site is switched off, its file stays in sites-available). Other system tools get their own `location`
# blocks below (the player owns "/", "/api" and "/ws").
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	client_max_body_size 0;      # album uploads are big; the player streams them to disk
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_request_buffering off; # stream uploads instead of spooling them to /var/lib/nginx first

	location / {
		proxy_pass http://127.0.0.1:8080;
	}

	location /ws {               # live state (WebSocket)
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 1d;
	}
}
