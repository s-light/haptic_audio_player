[project]
name = "haptic-audio-player"
version = "0.1.0"
description = "Child-friendly haptic (RFID + buttons) audio player for the PocketBeagle 2"
requires-python = ">=3.11"
dependencies = ["aiohttp", "pillow", "numpy"]

[project.optional-dependencies]
device = ["mutagen", "spidev"]
dev = ["pytest", "pytest-aiohttp", "mutagen", "pyflakes"]

[tool.setuptools]
packages = ["haptic_player"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
